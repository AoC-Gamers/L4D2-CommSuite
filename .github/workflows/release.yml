name: Release

on:
  push:
    tags:
      - sourcemod/v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCEMOD_VERSION: ${{ vars.SOURCEMOD_VERSION }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      basename: ${{ steps.release.outputs.basename }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}
      release_commit: ${{ steps.verify-tag.outputs.commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release ref
        id: inputs
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^sourcemod/v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag of the form sourcemod/vX.Y.Z." >&2
            exit 1
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Ensure tag points to main history
        id: verify-tag
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
        shell: bash
        run: |
          git fetch origin main
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          target_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$target_commit" "origin/main"; then
            echo "Tag $RELEASE_TAG does not point to a commit on main." >&2
            exit 1
          fi
          echo "commit=$target_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.verify-tag.outputs.commit }}
        run: |
          git show "${RELEASE_COMMIT}:CHANGELOG.md" > "$RUNNER_TEMP/commsuite-changelog.md"
          RELEASE_CHANGELOG="$RUNNER_TEMP/commsuite-changelog.md" make --no-print-directory resolve-release

  deps-smx:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Validate organization SourceMod version
        shell: bash
        run: |
          if [[ ! "$SOURCEMOD_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Set the AoC-Gamers Actions variable SOURCEMOD_VERSION to a SourceMod branch such as 1.12."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=smx-deps-${{ runner.os }}-${{ env.SOURCEMOD_VERSION }}-${{ hashFiles('scripts/deps/fetch-sourcemod.py', 'scripts/build/build-local.py', 'scripts/package/stage-artifact.py', 'scripts/package/package-release.py', 'scripts/package/package-map.json', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch SourceMod dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        run: make deps-smx PYTHON=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}" SMX_PLATFORM=linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

  build-smx:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - deps-smx

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_commit }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ needs.deps-smx.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build SMX
        run: make build-smx PYTHON=python3 SPCOMP=".deps/smx/sourcemod-linux/addons/sourcemod/scripting/spcomp"

      - name: Upload SMX build tree
        uses: actions/upload-artifact@v6
        with:
          name: smx-build
          path: .build/smx
          if-no-files-found: error
          retention-days: 1

      - name: Preserve the compile log from historical tags
        run: |
          if [[ -f deps/build-smx-compile.log ]]; then
            cp deps/build-smx-compile.log .build/build-smx-compile.log
          fi

      - name: Upload compile log
        uses: actions/upload-artifact@v6
        with:
          name: smx-compile-log
          path: .build/build-smx-compile.log
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-smx
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.release_commit }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/smx

      - name: Restore the log expected by historical tags
        if: ${{ hashFiles('plugin-package-map.json') != '' }}
        uses: actions/download-artifact@v8
        with:
          name: smx-compile-log
          path: deps

      - name: Package SMX tree
        run: make package-smx PYTHON=python3

      - name: Package zip
        run: make release PYTHON=python3 RELEASE_BASENAME="${{ needs.prepare-release.outputs.basename }}"

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.prepare-release.outputs.basename }}
          path: dist/release/${{ needs.prepare-release.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          files: dist/release/${{ needs.prepare-release.outputs.basename }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
