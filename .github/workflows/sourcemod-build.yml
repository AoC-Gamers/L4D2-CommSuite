name: SourceMod Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/sourcemod-build.yml
      - scripts/ci-build-sourcemod.sh
      - scripts/ci-package-release-assets.sh
      - addons/sourcemod/**
  pull_request:
    paths:
      - .github/workflows/sourcemod-build.yml
      - scripts/ci-build-sourcemod.sh
      - scripts/ci-package-release-assets.sh
      - addons/sourcemod/**
  workflow_dispatch:

concurrency:
  group: sourcemod-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCEMOD_ARCHIVE_URL: https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0-git7223-linux.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install SourceMod build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl tar python3

      - name: Compile SourceMod plugins
        run: bash ./scripts/ci-build-sourcemod.sh

      - name: Resolve artifact channel
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
        id: artifact
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            main)
              echo "version=latest" >> "$GITHUB_OUTPUT"
              echo "name=l4d2-commsuite-latest" >> "$GITHUB_OUTPUT"
              echo "release_name=Latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "version=develop" >> "$GITHUB_OUTPUT"
              echo "name=l4d2-commsuite-develop" >> "$GITHUB_OUTPUT"
              echo "release_name=Develop" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Package SourceMod artifact
        if: github.event_name != 'pull_request' && steps.artifact.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.artifact.outputs.version }}
        run: bash ./scripts/ci-package-release-assets.sh

      - name: Move channel tag
        if: github.event_name != 'pull_request' && steps.artifact.outputs.version != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.artifact.outputs.version }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.artifact.outputs.version }}" --force

      - name: Publish channel release
        if: github.event_name != 'pull_request' && steps.artifact.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.version }}
          name: ${{ steps.artifact.outputs.release_name }}
          prerelease: ${{ steps.artifact.outputs.prerelease == 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/release/l4d2-commsuite-${{ steps.artifact.outputs.version }}.zip
