name: SourceMod Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "channel/*"
    paths:
      - .gitattributes
      - scripts/**
      - Makefile
      - addons/sourcemod/**
      - README.md
      - LICENSE
      - NOTICES.md
      - CHANGELOG.md
      - .github/workflows/**
      - tests/**
  pull_request:
    branches:
      - main
      - develop
    paths:
      - .gitattributes
      - scripts/**
      - Makefile
      - addons/sourcemod/**
      - README.md
      - LICENSE
      - NOTICES.md
      - CHANGELOG.md
      - .github/workflows/**
      - tests/**
  workflow_dispatch:

concurrency:
  group: sourcemod-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCEMOD_VERSION: ${{ vars.SOURCEMOD_VERSION }}

jobs:
  deps-smx:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Validate organization SourceMod version
        shell: bash
        run: |
          if [[ ! "$SOURCEMOD_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Set the AoC-Gamers Actions variable SOURCEMOD_VERSION to a SourceMod branch such as 1.12."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Resolve dependency cache key
        id: cache-key
        shell: bash
        run: |
          echo "key=smx-deps-${{ runner.os }}-${{ env.SOURCEMOD_VERSION }}-${{ hashFiles('scripts/deps/fetch-sourcemod.py', 'scripts/build/build-local.py', 'scripts/package/stage-artifact.py', 'scripts/package/package-release.py', 'scripts/package/package-map.json', 'Makefile') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: deps-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

      - name: Fetch SourceMod dependencies
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        run: make deps-smx PYTHON=python3 SOURCEMOD_VERSION="${SOURCEMOD_VERSION}" SMX_PLATFORM=linux

      - name: Save dependency cache
        if: steps.deps-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .deps/smx
          key: ${{ steps.cache-key.outputs.key }}

  build-smx:
    runs-on: ubuntu-latest
    needs: deps-smx

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Restore dependency cache
        uses: actions/cache/restore@v5
        with:
          path: .deps/smx
          key: ${{ needs.deps-smx.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build SMX
        run: make build-smx PYTHON=python3

      - name: Upload SMX build tree
        uses: actions/upload-artifact@v6
        with:
          name: smx-build
          path: .build/smx
          if-no-files-found: error
          retention-days: 1

      - name: Upload compile log
        uses: actions/upload-artifact@v6
        with:
          name: smx-compile-log
          path: .build/build-smx-compile.log
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build-smx
    permissions:
      contents: write
    outputs:
      basename: ${{ steps.meta.outputs.basename }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 make

      - name: Download SMX build tree
        uses: actions/download-artifact@v8
        with:
          name: smx-build
          path: .build/smx

      - name: Package SMX tree
        run: make package-smx PYTHON=python3

      - name: Resolve artifact metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#channel/}"
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            version="develop"
            release_tag="channel/develop"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            version="latest"
            release_tag="channel/latest"
          else
            version="pr-${GITHUB_SHA::7}"
            release_tag=""
          fi
          printf "%s\n" "version=${version}" "basename=l4d2-commsuite-${version}" "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Package zip
        run: make release PYTHON=python3 RELEASE_BASENAME="${{ steps.meta.outputs.basename }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.basename }}
          path: dist/release/${{ steps.meta.outputs.basename }}.zip
          if-no-files-found: error
          retention-days: 14

  publish-channel:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download validated ZIP
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.basename }}
          path: dist/release

      - name: Publish release asset
        if: needs.release.outputs.release_tag != ''
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          name: ${{ needs.release.outputs.version == 'develop' && 'Develop' || 'Latest' }}
          target_commitish: ${{ github.sha }}
          files: dist/release/${{ needs.release.outputs.basename }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.release.outputs.release_tag == 'channel/develop' }}
          make_latest: ${{ needs.release.outputs.release_tag == 'channel/latest' }}

      - name: Advance rolling channel tag
        if: needs.release.outputs.release_tag != ''
        shell: bash
        run: |
          git tag --force "${{ needs.release.outputs.release_tag }}" "$GITHUB_SHA"
          git push --force origin "refs/tags/${{ needs.release.outputs.release_tag }}"
